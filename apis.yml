name: Truvian
description: >-
  Truvian Sciences is a San Diego-based diagnostics company founded in 2015 that
  develops an automated, benchtop blood-testing system combining clinical
  chemistries, immunoassays, and hematology assays within a single instrument to
  deliver lab-accurate results in under 30 minutes at the point of care. The
  company has raised roughly $208M across multiple rounds (including a Series C)
  and counts General Catalyst among its backers. Truvian is a diagnostics
  hardware and instrument business rather than a software/API provider: its
  public surface centers on the analyzer device, clinical assays, and FDA
  clearance for its testing platform. As of this profiling it publishes no public
  developer API, API documentation, developer portal, SDKs, or machine-readable
  specifications. This record is maintained in the API Evangelist network as a
  company profile; there is no API surface to enrich until Truvian ships a
  developer program.
